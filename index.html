<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>25:00 - 專注時間 | 番茄鐘</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google Fonts: Inter 與 Noto Sans TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                        mono: ['Inter', 'monospace'],
                    },
                    transitionProperty: {
                        'colors-shadow': 'background-color, border-color, color, fill, stroke, box-shadow',
                    }
                }
            }
        }
    </script>
    <style>
        /* 確保等寬數字，倒數計時不跳動 */
        .tabular-nums {
            font-variant-numeric: tabular-nums;
        }
        
        /* 環形進度條平滑過渡 */
        .progress-ring__circle {
            transition: stroke-dashoffset 0.35s linear, stroke 0.5s ease;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        /* 自訂滾動條 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 9999px;
        }
    </style>
</head>
<body id="app-body" class="min-h-screen bg-rose-50 text-slate-800 transition-colors duration-500 flex flex-col justify-between selection:bg-rose-200">

    <!-- 頂部導覽列 -->
    <header class="w-full max-w-xl mx-auto px-4 pt-5 pb-2 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
            <!-- 番茄 SVG 圖示 -->
            <div id="logo-badge" class="w-9 h-9 rounded-xl bg-rose-500 text-white flex items-center justify-center shadow-sm transition-colors duration-500">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="13" r="8"></circle>
                    <path d="M12 5c0-2 1.5-3 3-3"></path>
                    <path d="M12 5c-1.5-1.5-3.5-1.5-4.5-.5"></path>
                    <path d="M12 5c1.5-1.5 3.5-1.5 4.5-.5"></path>
                    <path d="M12 9v4l2.5 1.5"></path>
                </svg>
            </div>
            <h1 class="text-lg sm:text-xl font-bold tracking-tight">專注番茄鐘</h1>
        </div>

        <!-- 右側工具按鈕：靜音切換 & 設定 -->
        <div class="flex items-center gap-2">
            <button id="mute-toggle-btn" type="button" title="切換音效靜音" aria-label="切換音效靜音"
                class="p-2.5 rounded-xl bg-white/80 hover:bg-white text-slate-600 shadow-sm border border-black/5 transition active:scale-95">
                <!-- 喇叭開啟圖示 -->
                <svg id="icon-sound-on" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                </svg>
                <!-- 喇叭靜音圖示 (預設隱藏) -->
                <svg id="icon-sound-off" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 hidden text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <line x1="23" y1="9" x2="17" y2="15"></line>
                    <line x1="17" y1="9" x2="23" y2="15"></line>
                </svg>
            </button>

            <button id="settings-toggle-btn" type="button" title="時間與偏好設定" aria-label="開啟設定"
                class="flex items-center gap-1.5 px-3.5 py-2.5 rounded-xl bg-white/80 hover:bg-white text-slate-700 font-medium text-sm shadow-sm border border-black/5 transition active:scale-95">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
                <span>設定</span>
            </button>
        </div>
    </header>

    <!-- 主要計時器卡片區 -->
    <main class="w-full max-w-xl mx-auto px-4 py-4 flex-1 flex flex-col items-center justify-center">
        
        <!-- 狀態提示 Toast 訊息框 (取代 alert) -->
        <div id="toast-container" class="h-9 mb-2 flex items-center justify-center">
            <div id="toast-message" class="opacity-0 translate-y-1 transition-all duration-300 px-4 py-1.5 rounded-full bg-slate-800/90 text-white text-xs sm:text-sm font-medium shadow-md pointer-events-none">
                提示訊息
            </div>
        </div>

        <!-- 主面板 -->
        <div class="w-full bg-white/90 backdrop-blur-md rounded-3xl shadow-xl shadow-black/5 border border-white p-6 sm:p-8 flex flex-col items-center">
            
            <!-- 階段切換標籤列 -->
            <div class="w-full grid grid-cols-3 gap-1.5 p-1.5 bg-slate-100/90 rounded-2xl mb-7" role="tablist">
                <button type="button" data-mode="focus" class="mode-tab py-2.5 px-2 rounded-xl text-sm sm:text-base font-bold transition-all duration-200">
                    專注時間
                </button>
                <button type="button" data-mode="shortBreak" class="mode-tab py-2.5 px-2 rounded-xl text-sm sm:text-base font-medium transition-all duration-200">
                    短休息
                </button>
                <button type="button" data-mode="longBreak" class="mode-tab py-2.5 px-2 rounded-xl text-sm sm:text-base font-medium transition-all duration-200">
                    長休息
                </button>
            </div>

            <!-- 環形進度條與超大倒數時間顯示 -->
            <div class="relative w-64 h-64 sm:w-72 sm:h-72 flex items-center justify-center mb-7">
                <svg class="w-full h-full" viewBox="0 0 260 260">
                    <!-- 背景軌道圓環 -->
                    <circle
                        cx="130"
                        cy="130"
                        r="116"
                        fill="transparent"
                        stroke="#f1f5f9"
                        stroke-width="10"
                    />
                    <!-- 動態進度圓環 -->
                    <circle
                        id="progress-ring"
                        class="progress-ring__circle"
                        cx="130"
                        cy="130"
                        r="116"
                        fill="transparent"
                        stroke="#f43f5e"
                        stroke-width="10"
                        stroke-linecap="round"
                    />
                </svg>

                <!-- 中央時間與狀態文字 -->
                <div class="absolute inset-0 flex flex-col items-center justify-center text-center select-none">
                    <span id="status-badge" class="text-xs sm:text-sm font-bold tracking-wider uppercase px-3 py-1 rounded-full bg-rose-100 text-rose-600 mb-2 transition-colors duration-500">
                        準備專注
                    </span>
                    <div id="time-display" class="text-6xl sm:text-7xl font-extrabold tracking-tight text-slate-800 tabular-nums leading-none">
                        25:00
                    </div>
                    <p id="sub-status-text" class="text-xs text-slate-400 mt-2.5 font-medium">
                        按下開始進入心流
                    </p>
                </div>
            </div>

            <!-- 4 輪專注週期視覺化進度指示器 -->
            <div class="flex flex-col items-center mb-7">
                <div class="flex items-center gap-3 mb-2" id="cycle-dots" aria-label="專注週期進度">
                    <span class="w-3.5 h-3.5 rounded-full bg-slate-200 transition-all duration-300"></span>
                    <span class="w-3.5 h-3.5 rounded-full bg-slate-200 transition-all duration-300"></span>
                    <span class="w-3.5 h-3.5 rounded-full bg-slate-200 transition-all duration-300"></span>
                    <span class="w-3.5 h-3.5 rounded-full bg-slate-200 transition-all duration-300"></span>
                </div>
                <div class="text-xs sm:text-sm font-medium text-slate-500">
                    <span id="cycle-text">第 1 / 4 輪專注</span>
                    <span class="mx-1.5 text-slate-300">•</span>
                    <span>今日已完成 <strong id="total-completed-count" class="text-slate-700">0</strong> 個番茄</span>
                </div>
            </div>

            <!-- 主要控制按鈕群 -->
            <div class="w-full flex items-center justify-center gap-3 sm:gap-4">
                <!-- 重設按鈕 -->
                <button id="reset-btn" type="button" title="重設目前計時" aria-label="重設"
                    class="p-4 rounded-2xl bg-slate-100 hover:bg-slate-200/80 text-slate-600 font-semibold transition active:scale-95 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                        <path d="M3 3v5h5"></path>
                    </svg>
                </button>

                <!-- 開始 / 暫停 主按鈕 -->
                <button id="start-pause-btn" type="button"
                    class="flex-1 max-w-[200px] py-4 px-6 rounded-2xl bg-rose-500 hover:bg-rose-600 text-white font-bold text-lg sm:text-xl shadow-lg shadow-rose-500/30 transition-all duration-200 active:scale-95 flex items-center justify-center gap-2.5">
                    <svg id="icon-play" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 fill-current" viewBox="0 0 24 24">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                    <svg id="icon-pause" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 fill-current hidden" viewBox="0 0 24 24">
                        <rect x="6" y="4" width="4" height="16" rx="1"></rect>
                        <rect x="14" y="4" width="4" height="16" rx="1"></rect>
                    </svg>
                    <span id="start-pause-text">開始</span>
                </button>

                <!-- 跳過至下一階段按鈕 -->
                <button id="skip-btn" type="button" title="跳過此階段" aria-label="跳過"
                    class="p-4 rounded-2xl bg-slate-100 hover:bg-slate-200/80 text-slate-600 font-semibold transition active:scale-95 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="5 4 15 12 5 20 5 4"></polygon>
                        <line x1="19" y1="5" x2="19" y2="19"></line>
                    </svg>
                </button>
            </div>
        </div>
    </main>

    <!-- 底部簡易說明 -->
    <footer class="w-full max-w-xl mx-auto px-4 pb-5 pt-2 text-center text-xs text-slate-400">
        每完成 4 輪專注自動進入長休息 • 時間結束將自動切換並播放提示音
    </footer>

    <!-- 設定彈出視窗 (Modal) -->
    <div id="settings-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm transition-opacity">
        <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl border border-slate-100 overflow-hidden transform transition-all">
            <!-- Modal 標題列 -->
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
                <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                    計時器設定
                </h2>
                <button id="close-settings-btn" type="button" class="p-2 rounded-xl text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <!-- Modal 內容表單 -->
            <form id="settings-form" class="p-6 space-y-5">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">時間長度（分鐘）</label>
                    <div class="grid grid-cols-3 gap-3">
                        <div class="bg-rose-50/70 p-3 rounded-2xl border border-rose-100">
                            <label for="input-focus" class="block text-xs font-semibold text-rose-700 mb-1">專注時間</label>
                            <input id="input-focus" type="number" min="1" max="120" value="25" required
                                class="w-full bg-white rounded-xl px-3 py-2 text-center font-bold text-slate-800 border border-rose-200 focus:outline-none focus:ring-2 focus:ring-rose-400">
                        </div>
                        <div class="bg-emerald-50/70 p-3 rounded-2xl border border-emerald-100">
                            <label for="input-short-break" class="block text-xs font-semibold text-emerald-700 mb-1">短休息</label>
                            <input id="input-short-break" type="number" min="1" max="60" value="5" required
                                class="w-full bg-white rounded-xl px-3 py-2 text-center font-bold text-slate-800 border border-emerald-200 focus:outline-none focus:ring-2 focus:ring-emerald-400">
                        </div>
                        <div class="bg-sky-50/70 p-3 rounded-2xl border border-sky-100">
                            <label for="input-long-break" class="block text-xs font-semibold text-sky-700 mb-1">長休息</label>
                            <input id="input-long-break" type="number" min="1" max="60" value="15" required
                                class="w-full bg-white rounded-xl px-3 py-2 text-center font-bold text-slate-800 border border-sky-200 focus:outline-none focus:ring-2 focus:ring-sky-400">
                        </div>
                    </div>
                </div>

                <!-- 自動切換行為與音效測試 -->
                <div class="space-y-3 pt-2 border-t border-slate-100">
                    <label class="flex items-center justify-between cursor-pointer py-1">
                        <div>
                            <span class="text-sm font-semibold text-slate-700 block">時間到自動開始下一階段</span>
                            <span class="text-xs text-slate-400">倒數結束後自動切換並繼續計時</span>
                        </div>
                        <input id="input-auto-start" type="checkbox" checked
                            class="w-5 h-5 rounded-md text-rose-500 focus:ring-rose-400 border-slate-300 cursor-pointer">
                    </label>

                    <div class="flex items-center justify-between pt-2">
                        <div>
                            <span class="text-sm font-semibold text-slate-700 block">提示音效測試</span>
                            <span class="text-xs text-slate-400">使用 Web Audio 合成和弦提示音</span>
                        </div>
                        <button id="test-sound-btn" type="button"
                            class="px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition active:scale-95 flex items-center gap-1.5">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                            </svg>
                            試聽音效
                        </button>
                    </div>
                </div>

                <!-- 儲存與恢復預設按鈕 -->
                <div class="pt-3 flex items-center justify-between gap-3">
                    <button id="restore-defaults-btn" type="button"
                        class="px-4 py-2.5 rounded-xl text-xs font-semibold text-slate-500 hover:bg-slate-100 transition">
                        恢復預設值 (25/5/15)
                    </button>
                    <button type="submit"
                        class="px-6 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-900 text-white text-sm font-bold shadow-md transition active:scale-95">
                        儲存並套用
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        /**
         * 番茄鐘核心應用程式邏輯
         * 包含：狀態管理、精準時間戳倒數、Web Audio API 音效合成、動態主題切換與分頁標題更新
         */
        document.addEventListener('DOMContentLoaded', () => {
            // ================= 1. 狀態與設定初始化 =================
            const STORAGE_KEY = 'pomodoro_app_settings_v1';
            
            const defaultSettings = {
                focus: 25,
                shortBreak: 5,
                longBreak: 15,
                autoStart: true,
                muted: false
            };

            let settings = loadSettings();

            // 計時器狀態
            let currentMode = 'focus'; // 'focus' | 'shortBreak' | 'longBreak'
            let isRunning = false;
            let totalSeconds = settings.focus * 60;
            let remainingSeconds = totalSeconds;
            let timerInterval = null;
            let endTimeTimestamp = null; // 用於防止背景分頁節流導致計時不準

            // 週期進度追蹤
            let completedFocusInCycle = 0; // 0 ~ 3 (每滿 4 次觸發長休息並歸零)
            let totalCompletedToday = 0;

            // 主題色系配置表
            const themes = {
                focus: {
                    label: '專注時間',
                    badgeRunning: '專注進行中',
                    badgePaused: '準備專注',
                    subTextRunning: '保持專注，一次只做一件事',
                    subTextPaused: '按下開始進入心流',
                    bodyBg: 'bg-rose-50',
                    logoBg: 'bg-rose-500',
                    ringColor: '#f43f5e',
                    badgeBg: 'bg-rose-100',
                    badgeText: 'text-rose-600',
                    btnBg: 'bg-rose-500 hover:bg-rose-600 shadow-rose-500/30',
                    tabActive: 'bg-white text-rose-600 shadow-sm font-bold',
                    dotActive: 'bg-rose-500 ring-4 ring-rose-200',
                    dotCompleted: 'bg-rose-500'
                },
                shortBreak: {
                    label: '短休息',
                    badgeRunning: '短休息中',
                    badgePaused: '準備短休息',
                    subTextRunning: '起身喝口水、伸展一下吧',
                    subTextPaused: '放鬆片刻，恢復精神',
                    bodyBg: 'bg-emerald-50',
                    logoBg: 'bg-emerald-500',
                    ringColor: '#10b981',
                    badgeBg: 'bg-emerald-100',
                    badgeText: 'text-emerald-700',
                    btnBg: 'bg-emerald-500 hover:bg-emerald-600 shadow-emerald-500/30',
                    tabActive: 'bg-white text-emerald-600 shadow-sm font-bold',
                    dotActive: 'bg-emerald-500 ring-4 ring-emerald-200',
                    dotCompleted: 'bg-emerald-500'
                },
                longBreak: {
                    label: '長休息',
                    badgeRunning: '長休息中',
                    badgePaused: '準備長休息',
                    subTextRunning: '已完成 4 輪專注，好好犒賞自己！',
                    subTextPaused: '享受充裕的休息時光',
                    bodyBg: 'bg-sky-50',
                    logoBg: 'bg-sky-500',
                    ringColor: '#0ea5e9',
                    badgeBg: 'bg-sky-100',
                    badgeText: 'text-sky-700',
                    btnBg: 'bg-sky-500 hover:bg-sky-600 shadow-sky-500/30',
                    tabActive: 'bg-white text-sky-600 shadow-sm font-bold',
                    dotActive: 'bg-sky-500 ring-4 ring-sky-200',
                    dotCompleted: 'bg-sky-500'
                }
            };

            // ================= 2. DOM 元素快取 =================
            const appBody = document.getElementById('app-body');
            const logoBadge = document.getElementById('logo-badge');
            const timeDisplay = document.getElementById('time-display');
            const statusBadge = document.getElementById('status-badge');
            const subStatusText = document.getElementById('sub-status-text');
            const progressRing = document.getElementById('progress-ring');
            const startPauseBtn = document.getElementById('start-pause-btn');
            const startPauseText = document.getElementById('start-pause-text');
            const iconPlay = document.getElementById('icon-play');
            const iconPause = document.getElementById('icon-pause');
            const resetBtn = document.getElementById('reset-btn');
            const skipBtn = document.getElementById('skip-btn');
            const modeTabs = document.querySelectorAll('.mode-tab');
            const cycleDotsContainer = document.getElementById('cycle-dots');
            const cycleText = document.getElementById('cycle-text');
            const totalCompletedCountEl = document.getElementById('total-completed-count');
            const toastMessage = document.getElementById('toast-message');

            // 設定與音效相關元素
            const muteToggleBtn = document.getElementById('mute-toggle-btn');
            const iconSoundOn = document.getElementById('icon-sound-on');
            const iconSoundOff = document.getElementById('icon-sound-off');
            const settingsToggleBtn = document.getElementById('settings-toggle-btn');
            const settingsModal = document.getElementById('settings-modal');
            const closeSettingsBtn = document.getElementById('close-settings-btn');
            const settingsForm = document.getElementById('settings-form');
            const inputFocus = document.getElementById('input-focus');
            const inputShortBreak = document.getElementById('input-short-break');
            const inputLongBreak = document.getElementById('input-long-break');
            const inputAutoStart = document.getElementById('input-auto-start');
            const testSoundBtn = document.getElementById('test-sound-btn');
            const restoreDefaultsBtn = document.getElementById('restore-defaults-btn');

            // 環形進度條幾何常數 (r = 116)
            const RING_RADIUS = 116;
            const RING_CIRCUMFERENCE = 2 * Math.PI * RING_RADIUS;
            progressRing.style.strokeDasharray = `${RING_CIRCUMFERENCE} ${RING_CIRCUMFERENCE}`;
            progressRing.style.strokeDashoffset = 0;

            // ================= 3. Web Audio API 音效合成器 =================
            let audioCtx = null;

            function initAudioContext() {
                if (!audioCtx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (AudioContextClass) {
                        audioCtx = new AudioContextClass();
                    }
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }

            /**
             * 播放悅耳的和弦鐘聲提示音
             * @param {string} type - 'complete' (階段結束) 或 'click' (按鈕微互動)
             */
            function playSound(type = 'complete') {
                if (settings.muted && type !== 'test') return;
                
                try {
                    initAudioContext();
                    if (!audioCtx) return;

                    const now = audioCtx.currentTime;

                    if (type === 'complete' || type === 'test') {
                        // 播放清脆溫暖的三連音 (C5 -> E5 -> G5 -> C6)
                        const notes = [523.25, 659.25, 783.99, 1046.50];
                        notes.forEach((freq, idx) => {
                            const osc = audioCtx.createOscillator();
                            const gainNode = audioCtx.createGain();

                            osc.type = 'sine';
                            osc.frequency.setValueAtTime(freq, now + idx * 0.14);

                            gainNode.gain.setValueAtTime(0.001, now + idx * 0.14);
                            gainNode.gain.exponentialRampToValueAtTime(0.22, now + idx * 0.14 + 0.03);
                            gainNode.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.14 + 0.85);

                            osc.connect(gainNode);
                            gainNode.connect(audioCtx.destination);

                            osc.start(now + idx * 0.14);
                            osc.stop(now + idx * 0.14 + 0.9);
                        });
                    }
                } catch (err) {
                    console.warn('Web Audio API 播放受限:', err);
                }
            }

            // ================= 4. 輔助與儲存函式 =================
            function loadSettings() {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) {
                        return { ...defaultSettings, ...JSON.parse(saved) };
                    }
                } catch (e) {
                    console.warn('讀取設定失敗，使用預設值');
                }
                return { ...defaultSettings };
            }

            function saveSettings() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
                } catch (e) {
                    console.warn('儲存設定失敗');
                }
            }

            let toastTimeout = null;
            function showToast(msg) {
                toastMessage.textContent = msg;
                toastMessage.classList.remove('opacity-0', 'translate-y-1');
                toastMessage.classList.add('opacity-100', 'translate-y-0');

                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toastMessage.classList.remove('opacity-100', 'translate-y-0');
                    toastMessage.classList.add('opacity-0', 'translate-y-1');
                }, 2800);
            }

            function formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }

            // ================= 5. UI 更新與渲染 =================
            function updateDisplay() {
                const formatted = formatTime(remainingSeconds);
                timeDisplay.textContent = formatted;

                // 動態更新瀏覽器分頁標題
                const theme = themes[currentMode];
                const statePrefix = isRunning ? '' : '[已暫停] ';
                document.title = `${formatted} - ${statePrefix}${theme.label} | 番茄鐘`;

                // 更新環形進度條
                const progress = totalSeconds > 0 ? remainingSeconds / totalSeconds : 0;
                const offset = RING_CIRCUMFERENCE * (1 - progress);
                progressRing.style.strokeDashoffset = offset;
            }

            function updateThemeAndControls() {
                const theme = themes[currentMode];

                // 更新背景色與 Logo
                appBody.className = `min-h-screen ${theme.bodyBg} text-slate-800 transition-colors duration-500 flex flex-col justify-between selection:bg-rose-200`;
                logoBadge.className = `w-9 h-9 rounded-xl ${theme.logoBg} text-white flex items-center justify-center shadow-sm transition-colors duration-500`;
                progressRing.style.stroke = theme.ringColor;

                // 更新狀態徽章與副標題
                statusBadge.className = `text-xs sm:text-sm font-bold tracking-wider uppercase px-3 py-1 rounded-full ${theme.badgeBg} ${theme.badgeText} mb-2 transition-colors duration-500`;
                statusBadge.textContent = isRunning ? theme.badgeRunning : theme.badgePaused;
                subStatusText.textContent = isRunning ? theme.subTextRunning : theme.subTextPaused;

                // 更新主按鈕外觀與文字
                startPauseBtn.className = `flex-1 max-w-[200px] py-4 px-6 rounded-2xl ${theme.btnBg} text-white font-bold text-lg sm:text-xl shadow-lg transition-all duration-200 active:scale-95 flex items-center justify-center gap-2.5`;
                if (isRunning) {
                    startPauseText.textContent = '暫停';
                    iconPlay.classList.add('hidden');
                    iconPause.classList.remove('hidden');
                } else {
                    startPauseText.textContent = '開始';
                    iconPlay.classList.remove('hidden');
                    iconPause.classList.add('hidden');
                }

                // 更新模式切換標籤樣式
                modeTabs.forEach(tab => {
                    const mode = tab.getAttribute('data-mode');
                    if (mode === currentMode) {
                        tab.className = `mode-tab py-2.5 px-2 rounded-xl text-sm sm:text-base transition-all duration-200 ${theme.tabActive}`;
                    } else {
                        tab.className = 'mode-tab py-2.5 px-2 rounded-xl text-sm sm:text-base font-medium text-slate-500 hover:text-slate-700 transition-all duration-200';
                    }
                });

                updateCycleIndicator();
                updateDisplay();
            }

            function updateCycleIndicator() {
                const theme = themes[currentMode];
                const dots = cycleDotsContainer.querySelectorAll('span');
                
                // 計算目前處於第幾輪 (1~4)
                const currentRoundDisplay = Math.min(completedFocusInCycle + 1, 4);
                cycleText.textContent = currentMode === 'longBreak' 
                    ? '已完成 4 輪專注週期' 
                    : `第 ${currentRoundDisplay} / 4 輪專注`;
                
                totalCompletedCountEl.textContent = totalCompletedToday;

                dots.forEach((dot, index) => {
                    if (index < completedFocusInCycle) {
                        // 已完成的輪次
                        dot.className = `w-3.5 h-3.5 rounded-full ${theme.dotCompleted} transition-all duration-300`;
                    } else if (index === completedFocusInCycle && currentMode === 'focus') {
                        // 正在進行的專注輪次
                        dot.className = `w-3.5 h-3.5 rounded-full ${theme.dotActive} transition-all duration-300`;
                    } else {
                        // 尚未開始的輪次
                        dot.className = 'w-3.5 h-3.5 rounded-full bg-slate-200 transition-all duration-300';
                    }
                });
            }

            function updateMuteUI() {
                if (settings.muted) {
                    iconSoundOn.classList.add('hidden');
                    iconSoundOff.classList.remove('hidden');
                } else {
                    iconSoundOn.classList.remove('hidden');
                    iconSoundOff.classList.add('hidden');
                }
            }

            // ================= 6. 核心計時控制邏輯 =================
            function getDurationForMode(mode) {
                switch (mode) {
                    case 'focus': return settings.focus * 60;
                    case 'shortBreak': return settings.shortBreak * 60;
                    case 'longBreak': return settings.longBreak * 60;
                    default: return 25 * 60;
                }
            }

            function switchMode(newMode, autoStartNext = false) {
                pauseTimer();
                currentMode = newMode;
                totalSeconds = getDurationForMode(newMode);
                remainingSeconds = totalSeconds;
                updateThemeAndControls();

                if (autoStartNext) {
                    startTimer();
                }
            }

            function startTimer() {
                if (isRunning) return;
                
                // 使用者互動時解鎖 AudioContext
                initAudioContext();

                isRunning = true;
                endTimeTimestamp = Date.now() + remainingSeconds * 1000;
                updateThemeAndControls();

                timerInterval = setInterval(() => {
                    const now = Date.now();
                    const diff = Math.ceil((endTimeTimestamp - now) / 1000);

                    if (diff <= 0) {
                        remainingSeconds = 0;
                        updateDisplay();
                        handleTimerComplete();
                    } else if (diff !== remainingSeconds) {
                        remainingSeconds = diff;
                        updateDisplay();
                    }
                }, 200);
            }

            function pauseTimer() {
                if (!isRunning) return;
                isRunning = false;
                clearInterval(timerInterval);
                timerInterval = null;
                updateThemeAndControls();
            }

            function resetTimer() {
                pauseTimer();
                totalSeconds = getDurationForMode(currentMode);
                remainingSeconds = totalSeconds;
                updateThemeAndControls();
                showToast('已重設目前階段時間');
            }

            /**
             * 當計時器倒數歸零或手動跳過時觸發階段切換
             * @param {boolean} isManualSkip - 是否為手動點擊跳過
             */
            function handleTimerComplete(isManualSkip = false) {
                pauseTimer();

                if (!isManualSkip) {
                    playSound('complete');
                }

                if (currentMode === 'focus') {
                    completedFocusInCycle += 1;
                    totalCompletedToday += 1;

                    if (completedFocusInCycle >= 4) {
                        // 每完成 4 個專注，進入 15 分鐘長休息
                        showToast('太棒了！完成 4 輪專注，進入長休息時間');
                        switchMode('longBreak', settings.autoStart);
                    } else {
                        // 完成 1~3 次專注後，進入短休息
                        showToast(`完成第 ${completedFocusInCycle} 輪專注！休息一下吧`);
                        switchMode('shortBreak', settings.autoStart);
                    }
                } else {
                    // 休息結束（短休息或長休息）
                    if (currentMode === 'longBreak') {
                        // 長休息結束後重置 4 輪計數器
                        completedFocusInCycle = 0;
                    }
                    showToast('休息結束，開始新一輪專注！');
                    switchMode('focus', settings.autoStart);
                }
            }

            // ================= 7. 事件監聽綁定 =================
            startPauseBtn.addEventListener('click', () => {
                if (isRunning) {
                    pauseTimer();
                } else {
                    startTimer();
                }
            });

            resetBtn.addEventListener('click', resetTimer);

            skipBtn.addEventListener('click', () => {
                handleTimerComplete(true);
            });

            // 頂部標籤手動切換階段
            modeTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    const selectedMode = tab.getAttribute('data-mode');
                    if (selectedMode === currentMode) return;
                    
                    // 若從長休息手動切回專注且已完成 4 輪，歸零週期進度
                    if (currentMode === 'longBreak' && completedFocusInCycle >= 4) {
                        completedFocusInCycle = 0;
                    }
                    switchMode(selectedMode, false);
                });
            });

            // 靜音切換按鈕
            muteToggleBtn.addEventListener('click', () => {
                settings.muted = !settings.muted;
                saveSettings();
                updateMuteUI();
                showToast(settings.muted ? '已開啟靜音模式' : '已開啟提示音效');
            });

            // 開啟設定視窗
            settingsToggleBtn.addEventListener('click', () => {
                inputFocus.value = settings.focus;
                inputShortBreak.value = settings.shortBreak;
                inputLongBreak.value = settings.longBreak;
                inputAutoStart.checked = settings.autoStart;

                settingsModal.classList.remove('hidden');
                settingsModal.classList.add('flex');
            });

            // 關閉設定視窗
            function closeSettingsModal() {
                settingsModal.classList.add('hidden');
                settingsModal.classList.remove('flex');
            }

            closeSettingsBtn.addEventListener('click', closeSettingsModal);
            settingsModal.addEventListener('click', (e) => {
                if (e.target === settingsModal) {
                    closeSettingsModal();
                }
            });

            // 試聽音效按鈕
            testSoundBtn.addEventListener('click', () => {
                playSound('test');
            });

            // 恢復預設值
            restoreDefaultsBtn.addEventListener('click', () => {
                inputFocus.value = defaultSettings.focus;
                inputShortBreak.value = defaultSettings.shortBreak;
                inputLongBreak.value = defaultSettings.longBreak;
                inputAutoStart.checked = defaultSettings.autoStart;
                showToast('已填入預設值，請點擊儲存套用');
            });

            // 儲存設定表單
            settingsForm.addEventListener('submit', (e) => {
                e.preventDefault();

                const newFocus = Math.max(1, Math.min(120, parseInt(inputFocus.value, 10) || 25));
                const newShort = Math.max(1, Math.min(60, parseInt(inputShortBreak.value, 10) || 5));
                const newLong = Math.max(1, Math.min(60, parseInt(inputLongBreak.value, 10) || 15));
                const newAutoStart = inputAutoStart.checked;

                settings.focus = newFocus;
                settings.shortBreak = newShort;
                settings.longBreak = newLong;
                settings.autoStart = newAutoStart;

                saveSettings();
                closeSettingsModal();

                // 若目前計時器未在執行中，立即套用新的時間設定
                if (!isRunning) {
                    totalSeconds = getDurationForMode(currentMode);
                    remainingSeconds = totalSeconds;
                    updateDisplay();
                }
                showToast('設定已儲存並套用');
            });

            // 鍵盤快捷鍵支援 (空白鍵開始/暫停，Esc 關閉視窗)
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !settingsModal.classList.contains('hidden')) {
                    closeSettingsModal();
                    return;
                }
                // 避免在輸入框內按空白鍵觸發計時
                if (e.code === 'Space' && document.activeElement.tagName !== 'INPUT' && settingsModal.classList.contains('hidden')) {
                    e.preventDefault();
                    if (isRunning) pauseTimer();
                    else startTimer();
                }
            });

            // 初始化畫面狀態
            updateMuteUI();
            updateThemeAndControls();
        });
    </script>
</body>
</html>
